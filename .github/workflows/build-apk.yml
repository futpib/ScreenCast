name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;28.2.13676358'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          : "${KEYSTORE_BASE64:?Configure KEYSTORE_BASE64 before publishing}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/screencast-release.jks"

      - name: Test and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Set version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          python3 - <<'PY'
          import datetime
          import os
          import re
          from pathlib import Path

          tags = Path(os.environ['RUNNER_TEMP'], 'release-tags').read_text().splitlines()
          codes = [int(match[1]) for tag in tags if (match := re.fullmatch(r'android-.+\+([0-9]+)', tag))]
          code = max([31, *codes]) + 1
          if code > 999999999:
              raise SystemExit('Android version code exhausted')
          name = datetime.datetime.now(datetime.timezone.utc).strftime('%y.%m.%d.%H.%M')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\ncode={code}\ntag=android-{name}+{code}\n')
          PY

      - name: Build signed APK
        env:
          SCREENCAST_KEYSTORE_FILE: ${{ runner.temp }}/screencast-release.jks
          SCREENCAST_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          SCREENCAST_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          SCREENCAST_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: bash scripts/build-release.sh "$VERSION_NAME" "$VERSION_CODE" "$RUNNER_TEMP/release-apks"

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Android ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
          make_latest: true
          body: |
            Install **app-release.apk**. In Obtainium, add https://github.com/${{ github.repository }}.

            Built from ${{ github.sha }}. SHA256SUMS covers the APK.
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release-apks/app-release.apk
            ${{ runner.temp }}/release-apks/SHA256SUMS

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/screencast-release.jks"
